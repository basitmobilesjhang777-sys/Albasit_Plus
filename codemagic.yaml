workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Build Android APK
        script: |
          cd Albasit_Plus_Native_AndroidIDE
          chmod +x gradlew
          ./gradlew assembleDebug --warning-mode none
    artifacts:
      - Albasit_Plus_Native_AndroidIDE/app/build/outputs/**/*.apk
